apiVersion: v1
kind: Pod
metadata:
  name: emptydir-demo
  namespace: devops-class
spec:
  containers:
    - name: writer
      image: ubuntu:24.04
      command: ["sh", "-c", "sleep 36000"]
      volumeMounts:
        - name: shared-data
          mountPath: /data
  volumes:
    - name: shared-data
      emptyDir: {}
